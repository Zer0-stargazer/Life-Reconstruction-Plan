<!doctype html>
<meta charset="utf-8">
<title>og-gen</title>
<style>
  @font-face{font-family:'NSS';src:local('Noto Serif SC'),local('NotoSerifSC-VF'),local('Source Han Serif SC');}
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:#faf6ee;
       font-family:'NSS','Noto Serif SC','Source Han Serif SC',serif;}
  .wrap{position:relative;width:1200px;height:630px;padding:74px 84px;box-sizing:border-box;
        display:flex;flex-direction:column;justify-content:space-between;}
  .top{display:flex;align-items:center;justify-content:space-between}
  .kicker{font-size:19px;letter-spacing:.42em;color:#8a7f74}
  .title{font-size:118px;font-weight:700;line-height:1.04;color:#1f1915;letter-spacing:.02em;margin:0}
  .rule{display:flex;align-items:center;gap:22px;margin-top:26px}
  .rule .bar{width:64px;height:2px;background:#b2392b}
  .rule .en{font-size:17px;letter-spacing:.4em;color:#b2392b}
  .quote{margin-top:40px;font-size:27px;line-height:1.95;color:rgba(31,25,21,.82)}
  .quote .en{display:block;font-size:12px;letter-spacing:.34em;color:#a99f93;margin:2px 0 12px}
  .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #dcd6cf;padding-top:22px}
  .foot .zh{font-size:18px;color:#6a615b}
  .wm{position:absolute;right:-140px;top:-120px;width:640px;height:640px;opacity:.06}
</style>
<body>
  <div class="wrap">
    <svg class="wm" viewBox="0 0 40 40">
      <g transform="translate(20 20)">
        <circle r="18.5" fill="none" stroke="#1f1915" stroke-width="0.4"/>
        <circle r="12" fill="none" stroke="#1f1915" stroke-width="0.4"/>
        <circle r="5.5" fill="none" stroke="#1f1915" stroke-width="0.4"/>
        <g stroke="#1f1915" stroke-width="0.5">
          <line x1="0" y1="-18.5" x2="0" y2="-15"/><line x1="0" y1="18.5" x2="0" y2="15"/>
          <line x1="-18.5" y1="0" x2="-15" y2="0"/><line x1="18.5" y1="0" x2="15" y2="0"/>
        </g>
      </g>
    </svg>

    <div class="top">
      <svg width="62" height="62" viewBox="0 0 40 40">
        <rect x="0" y="0" width="40" height="40" rx="9" fill="#faf6ee"/>
        <path d="M24 29.5 C 29 30, 33 31.2, 36 32.5" fill="none" stroke="#35302b" stroke-width="2.6" stroke-linecap="round" opacity="0.38"/>
        <path d="M4.5 27.5 H16.5" fill="none" stroke="#35302b" stroke-width="3.6" stroke-linecap="round" opacity="0.55"/>
        <rect x="17" y="22.5" width="8" height="8" rx="1.6" fill="none" stroke="#b2392b" stroke-width="2.8"/>
        <path d="M25.5 26 C 30 25.2, 32.5 18.5, 35 10.5" fill="none" stroke="#b2392b" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="34.9" cy="10" r="2.6" fill="#b2392b"/>
      </svg>
      <span class="kicker">A PERSONAL DECISION ATLAS</span>
      <span class="kicker">VOL. 01</span>
    </div>

    <div>
      <h1 class="title">人生沙盘</h1>
      <div class="rule"><span class="bar"></span><span class="en">LIFE SANDBOX</span></div>
    </div>

    <div class="quote">
      <span class="en">FATE &nbsp;·&nbsp; LUCK &nbsp;·&nbsp; EFFORT</span>
      命是你拿到的牌，运是你出牌的时机，努力是你出牌的方式。
    </div>

    <div class="foot">
      <span class="zh">不是算命，是算概率</span>
      <span class="zh">七个模块 · 一条时间轴</span>
    </div>
  </div>
</body>
