<!doctype html>
<meta charset="utf-8">
<title>icon-gen</title>
<style>html,body{margin:0;padding:0;background:transparent}#mount{display:block;line-height:0}</style>
<body>
<div id="mount"></div>
<script>
  const P = new URLSearchParams(location.search);
  const S = Number(P.get('size')) || 192;
  const V = P.get('v') || 'full';
  const CINNABAR = '#b2392b';
  const PAPER = '#faf6ee';

  const full = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="${S}" height="${S}">
      <rect x="0" y="0" width="40" height="40" rx="3" fill="${CINNABAR}"/>
      <path d="M28.4 10.0 A13 13 0 1 1 13.5 8.7" fill="none" stroke="${PAPER}" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="28.4" cy="10.0" r="1.6" fill="${PAPER}"/>
      <rect x="15.2" y="14.2" width="9.6" height="5" fill="none" stroke="${PAPER}" stroke-width="1.3"/>
      <rect x="13.4" y="20.6" width="13.2" height="5.4" fill="none" stroke="${PAPER}" stroke-width="1.3"/>
    </svg>`;

  const compact = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="${S}" height="${S}">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="${CINNABAR}"/>
      <path d="M28.4 10.0 A13 13 0 1 1 13.5 8.7" fill="none" stroke="${PAPER}" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="28.4" cy="10.0" r="2.2" fill="${PAPER}"/>
      <rect x="14.4" y="13.4" width="11.2" height="6" fill="none" stroke="${PAPER}" stroke-width="2.2"/>
      <rect x="12.4" y="20.4" width="15.2" height="6.4" fill="none" stroke="${PAPER}" stroke-width="2.2"/>
    </svg>`;

  const maskable = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${S}" height="${S}">
      <rect x="0" y="0" width="512" height="512" fill="${CINNABAR}"/>
      <g transform="translate(256 256) scale(9) translate(-20 -20)">
        <path d="M28.4 10.0 A13 13 0 1 1 13.5 8.7" fill="none" stroke="${PAPER}" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="28.4" cy="10.0" r="1.6" fill="${PAPER}"/>
        <rect x="15.2" y="14.2" width="9.6" height="5" fill="none" stroke="${PAPER}" stroke-width="1.3"/>
        <rect x="13.4" y="20.6" width="13.2" height="5.4" fill="none" stroke="${PAPER}" stroke-width="1.3"/>
      </g>
    </svg>`;

  document.getElementById('mount').innerHTML = V === 'compact' ? compact : V === 'maskable' ? maskable : full;
</script>
</body>
