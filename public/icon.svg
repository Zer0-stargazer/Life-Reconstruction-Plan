<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <title>人生沙盘</title>
  <desc>一条人生轨迹进入窗口，从这里分叉：淡墨的原路继续，朱红的轨迹跃升</desc>
  <style>
    .paper { fill: #faf6ee; }
    .ink { stroke: #35302b; fill: none; }
    .red { stroke: #b2392b; fill: none; }
    .dot { fill: #b2392b; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #211d19; }
      .ink { stroke: #e8e6df; }
      .red { stroke: #e2674f; }
      .dot { fill: #e2674f; }
    }
  </style>

  <rect class="paper" x="0" y="0" width="40" height="40" rx="9"/>

  <!-- 原路（继续） -->
  <path class="ink" d="M24 29.5 C 29 30, 33 31.2, 36 32.5" stroke-width="2.6" stroke-linecap="round" opacity="0.38"/>
  <!-- 来路 -->
  <path class="ink" d="M4.5 27.5 H16.5" stroke-width="3.6" stroke-linecap="round" opacity="0.55"/>
  <!-- 窗口：分叉点 -->
  <rect class="red" x="17" y="22.5" width="8" height="8" rx="1.6" stroke-width="2.8"/>
  <!-- 跃升 -->
  <path class="red" d="M25.5 26 C 30 25.2, 32.5 18.5, 35 10.5" stroke-width="3.4" stroke-linecap="round"/>
  <circle class="dot" cx="34.9" cy="10" r="2.6"/>
</svg>
