  <circle cx="48" cy="16" r="1.1" fill="#f6efe2" fill-opacity="0.35"/>
  <circle cx="15" cy="49" r="0.8" fill="#f6efe2" fill-opacity="0.3"/>
  <text x="32" y="44" text-anchor="middle" font-family="Noto Serif SC, STSong, SimSun, serif" font-size="34" font-weight="700" fill="#f6efe2">重</text>
